[project]
name = "heidi-b2b-lead-generator"
version = "1.0.0"
description = "AI-powered B2B lead generation and qualification system for Heidi Systems targeting Berlin property management companies (Hausverwaltungen)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.1",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.7",
    "pandas>=2.2.2",
    "openpyxl>=3.1.2",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pymongo>=4.7.2",
    "dnspython>=2.6.1",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
